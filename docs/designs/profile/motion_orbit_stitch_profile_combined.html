iv\u003e\n\u003cscript\u003e\n  (function initProfileControls() {\n    // Sex Selector Interaction\n    const sexChips = document.querySelectorAll('.sex-chip');\n    sexChips.forEach(chip =\u003e {\n      chip.addEventListener('click', () =\u003e {\n        sexChips.forEach(c =\u003e {\n          c.classList.remove('bg-surface-card', 'text-text-primary', 'shadow-sm', 'active-sex');\n          c.classList.add('text-text-secondary');\n        });\n        chip.classList.add('bg-surface-card', 'text-text-primary', 'shadow-sm', 'active-sex');\n        chip.classList.remove('text-text-secondary');\n      });\n    });\n\n    // Fitness Experience Selector Interaction\n    const expChips = document.querySelectorAll('.exp-chip');\n    expChips.forEach(chip =\u003e {\n      chip.addEventListener('click', () =\u003e {\n        expChips.forEach(c =\u003e {\n          c.classList.remove('bg-nav-active-indicator', 'text-primary-container', 'shadow-xs');\n          c.classList.add('bg-surface-subtle', 'text-text-secondary');\n        });\n        chip.classList.remove('bg-surface-subtle', 'text-text-secondary');\n        chip.classList.add('bg-nav-active-indicator', 'text-primary-container', 'shadow-xs');\n      });\n    });\n\n    // Preference Selector Interaction\n    const prefChips = document.querySelectorAll('.pref-chip');\n    prefChips.forEach(chip =\u003e {\n      chip.addEventListener('click', () =\u003e {\n        prefChips.forEach(c =\u003e {\n          c.classList.remove('bg-nav-active-indicator', 'text-primary-container', 'shadow-xs', 'active-pref');\n          c.classList.add('bg-surface-subtle', 'text-text-secondary');\n          const check = c.querySelector('.check-indicator');\n          if (check) check.classList.add('opacity-0');\n        });\n        chip.classList.remove('bg-surface-subtle', 'text-text-secondary');\n        chip.classList.add('bg-nav-active-indicator', 'text-primary-container', 'shadow-xs', 'active-pref');\n        const activeCheck = chip.querySelector('.check-indicator');\n        if (activeCheck) activeCheck.classList.remove('opacity-0');\n      });\n    });\n\n    // Available Equipment Multi-select Interaction\n    const equipChips = document.querySelectorAll('.equip-chip');\n    equipChips.forEach(chip =\u003e {\n      chip.addEventListener('click', () =\u003e {\n        const isSelected = chip.classList.contains('active-equip');\n        const checkIcon = chip.querySelector('.equip-check');\n        if (isSelected) {\n          chip.classList.remove('active-equip', 'bg-nav-active-indicator', 'text-primary-container', 'shadow-xs');\n          chip.classList.add('bg-surface-subtle', 'text-text-secondary');\n          if (checkIcon) checkIcon.classList.add('hidden');\n        } else {\n          chip.classList.add('active-equip', 'bg-nav-active-indicator', 'text-primary-container', 'shadow-xs');\n          chip.classList.remove('bg-surface-subtle', 'text-text-secondary');\n          if (checkIcon) checkIcon.classList.remove('hidden');\n        }\n      });\n    });\n\n    // Save and Cancel actions\n    const saveBtn = document.getElementById('saveBtn');\n    const toast = document.getElementById('saveToast');\n    if (saveBtn \u0026\u0026 toast) {\n      saveBtn.addEventListener('click', () =\u003e {\n        toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');\n        toast.classList.add('opacity-100', 'translate-y-0');\n        setTimeout(() =\u003e {\n          toast.classList.remove('opacity-100', 'translate-y-0');\n          toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');\n        }, 2200);\n      });\n    }\n\n    const cancelBtn = document.getElementById('cancelBtn');\n    if (cancelBtn) {\n      cancelBtn.addEventListener('click', () =\u003e {\n        window.history.back();\n      });\n    }\n  })();\n\u003c/script\u003e\u003c/main\u003e\u003cscript\u003edocument.addEventListener('click',function(e){var a=e.target.closest('[data-path]'); u003e\n\u003cdiv\u003e\n\u003ch2 class=\"font-headline-sm text-headline-sm text-text-primary\"\u003eStandard Push-up Test\u003c/h2\u003e\n\u003cspan class=\"font-label-sm text-label-sm text-text-tertiary\"\u003eUpper Body Endurance Protocol\u003c/span\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cspan class=\"inline-flex items-center px-2 py-0.5 rounded-full bg-metric-positive-container text-metric-positive font-label-sm text-label-sm\"\u003eStandardized\u003c/span\u003e\n\u003c/div\u003e\n\u003cp class=\"font-body-md text-body-md text-text-secondary mt-1 leading-relaxed\"\u003e\n        Perform continuous repetitions with proper form until failure or pause. Keep core braced and chest within 5 cm of floor.\n      \u003c/p\u003e\n\u003cdiv class=\"mt-2 flex items-start gap-2 bg-surface-subtle rounded-lg p-2.5\"\u003e\n\u003cspan class=\"material-symbols-outlined text-primary-container text-[18px] mt-0.5 shrink-0\"\u003evideocam_off\u003c/span\u003e\n\u003cdiv class=\"flex flex-col\"\u003e\n\u003cspan class=\"font-label-md text-label-md text-text-primary\"\u003eManual Entry Mode\u003c/span\u003e\n\u003cspan class=\"font-body-sm text-body-sm text-text-secondary\"\u003eCamera repetition tracking is a future experimental feature.\u003c/span\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- Assessment Metadata: Date Selector --\u003e\n\u003cdiv class=\"flex items-center justify-between bg-surface-card rounded-xl p-space-md shadow-sm\"\u003e\n\u003cdiv class=\"flex items-center gap-3\"\u003e\n\u003cdiv class=\"w-10 h-10 rounded-lg bg-surface-subtle flex items-center justify-center text-text-secondary\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[20px]\"\u003ecalendar_today\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv class=\"flex flex-col\"\u003e\n\u003cspan class=\"font-label-sm text-label-sm uppercase text-text-tertiary\"\u003eAssessment Date\u003c/span\u003e\n\u003cspan class=\"font-headline-sm text-headline-sm text-text-primary\"\u003eToday, May 15, 2024\u003c/span\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cbutton class=\"h-10 w-10 flex items-center justify-center rounded-full bg-surface-subtle text-text-secondary active:bg-surface-variant transition-colors\" type=\"button\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[20px]\"\u003eedit_calendar\u003c/span\u003e\n\u003c/button\u003e\n\u003c/div\u003e\n\u003c!-- Primary Metric Entry: Repetition Counter --\u003e\n\u003cdiv class=\"flex flex-col bg-surface-card rounded-xl p-space-md shadow-sm gap-space-sm items-center text-center\"\u003e\n\u003cdiv class=\"flex items-center justify-between w-full\"\u003e\n\u003cspan class=\"font-label-sm text-label-sm uppercase tracking-wider text-text-secondary\"\u003eContinuous Repetitions\u003c/span\u003e\n\u003cspan class=\"inline-flex items-center gap-1 font-label-sm text-label-sm text-metric-positive bg-metric-positive-container px-2 py-0.5 rounded-full\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[14px]\"\u003etrending_up\u003c/span\u003e Target: 24+\n        \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv class=\"flex items-center justify-center gap-6 my-2 w-full\"\u003e\n\u003c!-- Decrement Button --\u003e\n\u003cbutton class=\"w-14 h-14 rounded-full bg-surface-subtle flex items-center justify-center text-text-primary active:scale-95 active:bg-surface-variant transition-all shadow-sm\" id=\"btn-decrement\" type=\"button\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[28px]\"\u003eremove\u003c/span\u003e\n\u003c/button\u003e\n\u003c!-- Metric Display --\u003e\n\u003cdiv class=\"flex flex-col items-center min-w-[120px]\"\u003e\n\u003cdiv class=\"flex items-baseline justify-center gap-1\"\u003e\n\u003cspan class=\"font-headline-xl-mobile text-headline-xl-mobile text-primary tracking-tight font-bold\" id=\"rep-counter\"\u003e26\u003c/span\u003e\n\u003cspan class=\"font-label-lg text-label-lg text-text-secondary font-medium\"\u003ereps\u003c/span\u003e\n\u003c/div\u003e\n\u003cspan class=\"font-body-sm text-body-sm text-text-tertiary mt-0.5\"\u003e85th Percentile for Age\u003c/span\u003e\n\u003c/div\u003e\n\u003c!-- Increment Button --\u003e\n\u003cbutton class=\"w-14 h-14 rounded-full bg-primary-container flex items-center justify-center text-on-primary active:scale-95 active:bg-primary transition-all shadow-sm\" id=\"btn-increment\" type=\"button\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[28px]\"\u003eadd\u003c/span\u003e\n\u003c/button\u003e\n\u003c/div\u003e\n\u003c!-- Quick Set Direct Adjustment Chips --\u003e\n\u003cdiv class=\"flex items-center justify-center gap-2 pt-2 w-full\"\u003e\n\u003cbutton class=\"px-3 py-1.5 rounded-lg bg-surface-subtle text-text-secondary font-label-md text-label-md hover:bg-surface-variant active:scale-95\" onclick=\"adjustReps(15)\" type=\"button\"\u003e15\u003c/button\u003e\n\u003cbutton class=\"px-3 py-1.5 rounded-lg bg-surface-subtle text-text-secondary font-label-md text-label-md hover:bg-surface-variant active:scale-95\" onclick=\"adjustReps(20)\" type=\"button\"\u003e20\u003c/button\u003e\n\u003cbutton class=\"px-3 py-1.5 rounded-lg bg-surface-subtle text-text-secondary font-label-md text-label-md hover:bg-surface-variant active:scale-95\" onclick=\"adjustReps(25)\" type=\"button\"\u003e25\u003c/button\u003e\n\u003cbutton class=\"px-3 py-1.5 rounded-lg bg-surface-subtle text-text-secondary font-label-md text-label-md hover:bg-surface-variant active:scale-95\" onclick=\"adjustReps(30)\" type=\"button\"\u003e30\u003c/button\u003e\n\u003cbutton class=\"px-3 py-1.5 rounded-lg bg-surface-subtle text-text-secondary font-label-md text-label-md hover:bg-surface-variant active:scale-95\" onclick=\"adjustReps(35)\" type=\"button\"\u003e35\u003c/button\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- Secondary Parameter: Test Duration --\u003e\n\u003cdiv class=\"flex items-center justify-between bg-surface-card rounded-xl p-space-md shadow-sm\"\u003e\n\u003cdiv class=\"flex items-center gap-3\"\u003e\n\u003cdiv class=\"w-10 h-10 rounded-lg bg-surface-subtle flex items-center justify-center text-text-secondary\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[20px]\"\u003etimer\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv class=\"flex flex-col\"\u003e\n\u003cdiv class=\"flex items-center gap-1.5\"\u003e\n\u003cspan class=\"font-label-sm text-label-sm uppercase text-text-tertiary\"\u003eTest Duration\u003c/span\u003e\n\u003cspan class=\"font-label-sm text-label-sm text-text-tertiary\"\u003e(Optional)\u003c/span\u003e\n\u003c/div\u003e\n\u003cspan class=\"font-headline-sm text-headline-sm text-text-primary\"\u003e01:15 \u003cspan class=\"font-body-sm text-body-sm text-text-secondary font-normal\"\u003emin:sec\u003c/span\u003e\u003c/span\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cbutton class=\"px-3 py-1.5 rounded-lg bg-surface-subtle font-label-md text-label-md text-text-secondary active:bg-surface-variant\" type=\"button\"\u003e\n        Adjust Time\n      \u003c/button\u003e\n\u003c/div\u003e\n\u003c!-- Perceived Exertion (RPE) Segmented Matrix --\u003e\n\u003cdiv class=\"flex flex-col bg-surface-card rounded-xl p-space-md shadow-sm gap-space-sm\"\u003e\n\u003cdiv class=\"flex items-center justify-between\"\u003e\n\u003cdiv class=\"flex items-center gap-2\"\u003e\n\u003cspan class=\"material-symbols-outlined text-metric-amber text-[20px]\"\u003ebolt\u003c/span\u003e\n\u003cspan class=\"font-headline-sm text-headline-sm text-text-primary\"\u003eRate of Perceived Exertion\u003c/span\u003e\n\u003c/div\u003e\n\u003cspan class=\"font-label-md text-label-md px-2.5 py-1 rounded-full bg-metric-amber-container text-metric-amber\" id=\"rpe-label-tag\"\u003e\n          RPE 8 — Hard\n        \u003c/span\u003e\n\u003c/div\u003e\n\u003cp class=\"font-body-sm text-body-sm text-text-secondary\"\u003e\n        Scale 1 (Minimal effort) to 10 (Maximum absolute failure threshold).\n      \u003c/p\u003e\n\u003c!-- Segmented Numerical Gauge --\u003e\n\u003cdiv class=\"grid grid-cols-10 gap-1 mt-1 bg-surface-subtle p-1.5 rounded-xl\"\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(1, 'Very Light')\" type=\"button\"\u003e1\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(2, 'Light')\" type=\"button\"\u003e2\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(3, 'Moderate')\" type=\"button\"\u003e3\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(4, 'Somewhat Firm')\" type=\"button\"\u003e4\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(5, 'Sub-Threshold')\" type=\"button\"\u003e5\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(6, 'Vigorous')\" type=\"button\"\u003e6\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(7, 'Challenging')\" type=\"button\"\u003e7\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md bg-metric-amber text-on-primary flex items-center justify-center shadow-sm\" onclick=\"setRPE(8, 'Hard')\" type=\"button\"\u003e8\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(9, 'Near Max')\" type=\"button\"\u003e9\u003c/button\u003e\n\u003cbutton class=\"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\" onclick=\"setRPE(10, 'Max Effort')\" type=\"button\"\u003e10\u003c/button\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- Qualitative Assessment Notes --\u003e\n\u003cdiv class=\"flex flex-col bg-surface-card rounded-xl p-space-md shadow-sm gap-space-xs\"\u003e\n\u003cdiv class=\"flex items-center justify-between\"\u003e\n\u003clabel class=\"font-headline-sm text-headline-sm text-text-primary\" for=\"assessment-notes\"\u003ePerformance Notes\u003c/label\u003e\n\u003cspan class=\"font-label-sm text-label-sm text-text-tertiary\"\u003eOptional\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv class=\"relative mt-1\"\u003e\n\u003ctextarea class=\"w-full bg-surface-subtle text-text-primary font-body-md text-body-md rounded-xl p-3 focus:outline-none focus:bg-surface-card transition-colors placeholder:text-text-tertiary\" id=\"assessment-notes\" placeholder=\"Good chest drive, triceps fatigued towards end.\" rows=\"3\"\u003eGood chest drive, triceps fatigued towards end.\u003c/textarea\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- Action Buttons Trigger Area --\u003e\n\u003cdiv class=\"flex flex-col gap-3 pt-2\"\u003e\n\u003cbutton class=\"w-full h-12 bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:bg-primary transition-all\" id=\"save-btn\" type=\"button\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[20px]\"\u003esave\u003c/span\u003e\n        Save Assessment Result\n      \u003c/button\u003e\n\u003cbutton class=\"w-full h-12 bg-surface-subtle text-text-secondary rounded-xl font-label-lg text-label-lg flex items-center justify-center active:bg-surface-variant transition-colors\" type=\"button\"\u003e\n        Cancel\n      \u003c/button\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n  let reps = 26;\n  const repDisplay = document.getElementById('rep-counter');\n  const btnDec = document.getElementById('btn-decrement');\n  const btnInc = document.getElementById('btn-increment');\n  const rpeTag = document.getElementById('rpe-label-tag');\n  const rpeButtons = document.querySelectorAll('.rpe-btn');\n\n  function updateRepDisplay() {\n    if (repDisplay) {\n      repDisplay.textContent = reps;\n    }\n  }\n\n  function adjustReps(val) {\n    reps = val;\n    updateRepDisplay();\n  }\n\n  if (btnDec \u0026\u0026 btnInc) {\n    btnDec.addEventListener('click', () =\u003e {\n      if (reps \u003e 0) {\n        reps--;\n        updateRepDisplay();\n      }\n    });\n\n    btnInc.addEventListener('click', () =\u003e {\n      reps++;\n      updateRepDisplay();\n    });\n  }\n\n  function setRPE(value, label) {\n    if (rpeTag) {\n      rpeTag.textContent = `RPE ${value} — ${label}`;\n      if (value \u003e= 9) {\n        rpeTag.className = \"font-label-md text-label-md px-2.5 py-1 rounded-full bg-metric-caution-container text-metric-caution\";\n      } else if (value \u003e= 7) {\n        rpeTag.className = \"font-label-md text-label-md px-2.5 py-1 rounded-full bg-metric-amber-container text-metric-amber\";\n      } else {\n        rpeTag.className = \"font-label-md text-label-md px-2.5 py-1 rounded-full bg-metric-positive-container text-metric-positive\";\n      }\n    }\n\n    rpeButtons.forEach((btn, idx) =\u003e {\n      if (idx + 1 === value) {\n        btn.className = \"rpe-btn h-9 rounded-lg font-label-md text-label-md bg-primary-container text-on-primary flex items-center justify-center shadow-sm\";\n      } else {\n        btn.className = \"rpe-btn h-9 rounded-lg font-label-md text-label-md text-text-secondary flex items-center justify-center\";\n      }\n    });\n  }\n\u003c/script\u003e\u003c/main\u003e\u003cscript\u003edocument.addEventListener('click',function(e){var a=e.target.closest('[data-path]');if(!a)return;var p=a.getAttribute('data-path');if(p){e.preventDefault();window.parent.postMessage({ n      });\n    });\n  });\n\n  // Toggle Comparison View Mode\n  const toggleList = document.getElementById('toggle-list');\n  const toggleCompare = document.getElementById('toggle-compare');\n  const compSection = document.getElementById('comparison-section');\n\n  toggleList.addEventListener('click', () =\u003e {\n    toggleList.classList.add('bg-surface-card', 'shadow-sm', 'text-text-primary', 'font-semibold');\n    toggleList.classList.remove('text-text-secondary');\n    toggleCompare.classList.remove('bg-surface-card', 'shadow-sm', 'text-text-primary', 'font-semibold');\n    toggleCompare.classList.add('text-text-secondary');\n    compSection.classList.add('hidden');\n  });\n\n  toggleCompare.addEventListener('click', () =\u003e {\n    toggleCompare.classList.add('bg-surface-card', 'shadow-sm', 'text-text-primary', 'font-semibold');\n    toggleCompare.classList.remove('text-text-secondary');\n    toggleList.classList.remove('bg-surface-card', 'shadow-sm', 'text-text-primary', 'font-semibold');\n    toggleList.classList.add('text-text-secondary');\n    compSection.classList.remove('hidden');\n  });\n\u003c/script\u003e\u003c/main\u003e\u003cscript\u003edocument.addEventListener('click',function(e){var a=e.target.closest('[data-path]');if(!a)return;var p=a.getAttribute('data-path');if(p){e.preventDefault();window.parent.postMessage({kind:'stitch-nav',path:p},'*')}});\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e"}, {"id": "body-measurements", "name": "Body Measurements", "source": "p06_body_measurements_code.html", "html": "\u003c!DOCTYPE html\u003e\u003chtml class=\"h-full bg-background\" lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" name=\"viewport\"\u003e\u003cmeta content=\"mobile_stack\" name=\"shell-type\"\u003e\u003clink href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700\u0026amp;family=Manr 03cspan class=\"material-symbols-outlined text-[18px] text-text-tertiary mt-0.5\"\u003everified_user\u003c/span\u003e\n\u003cp class=\"font-body-sm text-body-sm text-text-tertiary\"\u003e\n        Self-measured dimensions are recorded for personal progress comparison and encrypted locally on this device.\n      \u003c/p\u003e\n\u003c/div\u003e\n\u003c/form\u003e\n\u003c!-- Sticky Bottom Actions Container --\u003e\n\u003cdiv class=\"fixed bottom-0 left-0 right-0 z-40 bg-surface-card/95 backdrop-blur-md px-margin py-space-md shadow-[0_-4px_20px_-2px_rgba(15,23,42,0.08)]\"\u003e\n\u003cdiv class=\"max-w-md mx-auto flex flex-col gap-space-xs\"\u003e\n\u003cbutton class=\"w-full h-12 bg-primary-container text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-2 active:bg-primary shadow-sm transition-colors\" id=\"saveButton\" type=\"button\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[20px]\"\u003echeck\u003c/span\u003e\n        Save Measurement\n      \u003c/button\u003e\n\u003ca class=\"w-full h-11 bg-transparent hover:bg-surface-subtle text-text-secondary font-label-lg text-label-lg rounded-xl flex items-center justify-center transition-colors\" data-path=\"measurements-history\" href=\"#\"\u003e\n        Cancel\n      \u003c/a\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n  // Simple collapsible interaction for optional measurements\n  const accordionToggle = document.getElementById('accordionToggle');\n  const accordionContent = document.getElementById('accordionContent');\n  const accordionIcon = document.getElementById('accordionIcon');\n\n  accordionToggle.addEventListener('click', () =\u003e {\n    const isExpanded = accordionToggle.getAttribute('aria-expanded') === 'true';\n    if (isExpanded) {\n      accordionContent.classList.add('hidden');\n      accordionToggle.setAttribute('aria-expanded', 'false');\n      accordionIcon.classList.add('rotate-180');\n    } else {\n      ac xt-text-primary uppercase tracking-wider\"\u003eCoach Insight\u003c/p\u003e\n\u003cp class=\"font-body-sm text-body-sm text-text-secondary truncate\"\u003e\"Hypertrophy demands consistent stimulus over haste. You're right on pace.\"\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- Bottom Action Button --\u003e\n\u003cdiv class=\"sticky bottom-4 w-full pt-2\"\u003e\n\u003cbutton class=\"w-full h-12 bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 active:bg-primary transition-all duration-150 transform active:scale-[0.99]\" id=\"addGoalBtn\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[20px]\"\u003eadd\u003c/span\u003e\n\u003cspan\u003eAdd New Goal\u003c/span\u003e\n\u003c/button\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n  (function() {\n    const menuBtn = document.getElementById('primaryGoalMenuBtn');\n    const menu = document.getElementById('primaryGoalMenu');\n\n    if (menuBtn \u0026\u0026 menu) {\n      menuBtn.addEventListener('click', function(e) {\n        e.stopPropagation();\n        menu.classList.toggle('hidden');\n      });\n\n      document.addEventListener('click', function(e) {\n        if (!menu.contains(e.target) \u0026\u0026 !menuBtn.contains(e.target)) {\n          menu.classList.add('hidden');\n        }\n      });\n    }\n\n    const addGoalBtn = document.getElementById('addGoalBtn');\n    if (addGoalBtn) {\n      addGoalBtn.addEventListener('click', function() {\n        const originalText = addGoalBtn.innerHTML;\n        addGoalBtn.innerHTML = '\u003cspan class=\"material-symbols-outlined text-[20px] animate-spin\"\u003eprogress_activity\u003c/span\u003e\u003cspan\u003ePreparing Goal Studio...\u003c/span\u003e';\n        setTimeout(() =\u003e {\n          addGoalBtn.innerHTML = originalText;\n        }, 1200);\n      });\n    }\n  })();\n\u003c/script\u003e\u003c/main\u003e\u003cscript\u003edocu ont-label-sm text-label-sm text-error bg-surface-card hover:bg-error-container active:scale-95 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 shadow-xs\" onclick=\"confirmDeleteModel()\" type=\"button\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[16px]\"\u003edelete\u003c/span\u003e\n\u003cspan\u003ePurge Model\u003c/span\u003e\n\u003c/button\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- Explanatory note --\u003e\n\u003cdiv class=\"flex items-start gap-space-xs text-text-secondary px-1\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[16px] text-text-tertiary mt-0.5\"\u003einfo\u003c/span\u003e\n\u003cp class=\"font-body-sm text-body-sm leading-relaxed text-text-tertiary\"\u003e\n          Model weights require an initial one-time download; all kinematic assessments and joint angles run 100% locally with zero battery drain from network handshakes.\n        \u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- SECTION 6: Data Management --\u003e\n\u003cdiv class=\"flex flex-col mb-space-lg\"\u003e\n\u003cdiv class=\"flex items-center gap-space-xs mb-space-xs px-space-xs\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[18px] text-primary\"\u003edatabase\u003c/span\u003e\n\u003ch2 class=\"font-label-md text-label-md text-text-secondary uppercase tracking-wider\"\u003eData Management\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv class=\"bg-surface-card rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm\"\u003e\n\u003c!-- Export Data Action --\u003e\n\u003cbutton class=\"w-full h-12 bg-surface-subtle hover:bg-surface-container active:bg-surface-variant text-text-primary font-label-lg text-label-lg rounded-xl flex items-center justify-between px-space-md transition-colors\" type=\"button\"\u003e\n\u003cdiv class=\"flex items-center gap-space-xs\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[20px] text-primary\"\u003edownload\u003c/span\u003e\n\u003cspan\u003eExport JSON / nter mb-1 text-primary\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[28px]\"\u003eorbit\u003c/span\u003e\n\u003c/div\u003e\n\u003ch3 class=\"font-headline-sm text-headline-sm text-text-primary\"\u003eMotion Orbit\u003c/h3\u003e\n\u003cspan class=\"font-label-md text-label-md text-text-tertiary\"\u003eVersion 2.4.0 (Offline Build 2408)\u003c/span\u003e\n\u003cdiv class=\"flex items-center justify-center gap-space-md mt-space-sm pt-space-sm w-full border-t border-hairline/60\"\u003e\n\u003ca class=\"font-label-sm text-label-sm text-primary flex items-center gap-1 hover:underline\" href=\"#\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[16px]\"\u003ecode\u003c/span\u003e\n\u003cspan\u003eOpen Source Licenses\u003c/span\u003e\n\u003c/a\u003e\n\u003cspan class=\"text-text-tertiary\"\u003e•\u003c/span\u003e\n\u003ca class=\"font-label-sm text-label-sm text-primary flex items-center gap-1 hover:underline\" href=\"#\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[16px]\"\u003eterminal\u003c/span\u003e\n\u003cspan\u003eGitHub Repository\u003c/span\u003e\n\u003c/a\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c!-- Interactive Modal Dialog Simulation --\u003e\n\u003cdiv class=\"hidden fixed inset-0 z-50 bg-text-primary/40 backdrop-blur-xs flex items-center justify-center p-margin\" id=\"reset-modal\"\u003e\n\u003cdiv class=\"bg-surface-card rounded-2xl p-space-lg w-full max-w-sm flex flex-col gap-space-md shadow-xl animate-in fade-in zoom-in-95 duration-150\"\u003e\n\u003cdiv class=\"w-12 h-12 rounded-full bg-metric-caution-container text-error flex items-center justify-center mx-auto\"\u003e\n\u003cspan class=\"material-symbols-outlined text-[28px]\"\u003edelete_forever\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv class=\"text-center flex flex-col gap-1\"\u003e\n\u003ch3 class=\"font-headline-md text-headline-md text-text-primary\"\u003eWipe Local Database?\u003c/h3\u003e\n\u003cp class=\"font-body-md text-body-md text-text-secondary leading-snug\"\u003e\n          This will irreversibly delete your local training diaries, personal records, and telemetry metrics. No cloud recovery exists.\n        \u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\"flex flex-col gap-space-xs mt-space-xs\"\u003e\n\u003cbutton class=\"w-full h-12 bg-error text-on-error font-label-lg text-label-lg rounded-xl flex items-center justify-center font-semibold active:opacity-90 transition-opacity\" onclick=\"closeResetModal()\" type=\"button\"\u003e\n          Confirm Deletion\n        \u003c/button\u003e\n\u003cbutton class=\"w-full h-12 bg-surface-subtle text-text-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center font-medium active:bg-surface-container transition-colors\" onclick=\"closeResetModal()\" type=\"button\"\u003e\n          Cancel\n        \u003c/button\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n  function setTheme(btn) {\n    const parent = document.getElementById('theme-selector');\n    const buttons = parent.querySelectorAll('button');\n    buttons.forEach(b =\u003e {\n      b.className = 'py-2 px-1 text-center font-label-sm text-label-sm rounded-lg text-text-secondary hover:text-text-primary transition-all flex items-center justify-center gap-1';\n    });\n    btn.className = 'py-2 px-1 text-center font-label-sm text-label-sm rounded-lg bg-surface-card text-primary font-semibold shadow-xs transition-all flex items-center justify-center gap-1';\n  }\n\n  function setUnits(btn, unit) {\n    const parent = document.getElementById('unit-selector');\n    const buttons = parent.querySelectorAll('button');\n    buttons.forEach(b =\u003e {\n      b.className = 'py-2.5 px-space-sm rounded-lg text-text-secondary font-label-sm text-label-sm flex flex-col items-center justify-center hover:text-text-primary transition-all';\n      const spans = b.querySelectorAll('span');\n      if (spans[1]) spans[1].className = 'font-body-sm text-body-sm text-text-tertiary';\n    });\n    btn.className = 'py-2.5 px-space-sm rounded-lg bg-surface-card text-primary font-label-sm text-label-sm font-semibold shadow-xs flex flex-col items-center justify-center transition-all';\n    const subtext = btn.querySelectorAll('span')[1];\n    if (subtext) subtext.className = 'font-body-sm text-body-sm text-text-secondary';\n  }\n\n  function toggleSwitch(btn) {\n    const isChecked = btn.getAttribute('aria-checked') === 'true';\n    const thumb = btn.firstElementChild;\n    if (isChecked) {\n      btn.setAttribute('aria-checked', 'false');\n      btn.classList.remove('bg-primary-container');\n      btn.classList.add('bg-surface-variant');\n      thumb.classList.remove('translate-x-5');\n      thumb.classList.add('translate-x-0');\n    } else {\n      btn.setAttribute('aria-checked', 'true');\n      btn.classList.remove('bg-surface-variant');\n      btn.classList.add('bg-primary-container');\n      thumb.classList.remove('translate-x-0');\n      thumb.classList.add('translate-x-5');\n    }\n  }\n\n  function confirmDeleteModel() {\n    alert(\"Model uninstalled from local storage cache. Offline kinetic vision disabled until redownloaded.\");\n  }\n\n  function promptResetProfile() {\n    document.getElementById('reset-modal').classList.remove('hidden');\n  }\n\n  function closeResetModal() {\n    document.getElementById('reset-modal').classList.add('hidden');\n  }\n\u003c/script\u003e\u003c/main\u003e\u003cscript\u003edocument.addEventListener('click',function(e){var a=e.target.closest('[data-path]');if(!a)return;var p=a.getAttribute('data-path');if(p){e.preventDefault();window.parent.postMessage({kind:'stitch-nav',path:p},'*')}});\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e"}]</script>
<script>
const pages=JSON.parse(document.getElementById('stitch-screens').textContent);
const mapped={"profile-overview": 0, "personal-information": 1, "fitness-assessment": 2, "body-measurements": 5, "measurements-history": 5, "progress": 7, "goals": 8, "settings": 10, "settings-units": 10};
let current=0;
const frame=document.getElementById('preview'),menu=document.getElementById('menu'),mobile=document.getElementById('mobile');
for(const [i,p] of pages.entries()){
 const button=document.createElement('button');button.className='nav';button.dataset.index=i;
 const no=document.createElement('span');no.className='number';no.textContent=String(i+1).padStart(2,'0');
 const label=document.createElement('span');label.textContent=p.name;button.append(no,label);
 button.addEventListener('click',()=>show(i));menu.append(button);
 const option=document.createElement('option');option.value=String(i);option.textContent=String(i+1).padStart(2,'0')+' — '+p.name;mobile.append(option);
}
function show(i){current=(i+pages.length)%pages.length;const p=pages[current];document.getElementById('screenTitle').textContent=p.name;document.getElementById('sourceCaption').textContent=p.source+' · Screen '+(current+1)+' of '+pages.length;frame.srcdoc=p.html;mobile.value=String(current);document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===current));history.replaceState(null,'','#'+p.id)}
document.getElementById('previous').onclick=()=>show(current-1);
document.getElementById('next').onclick=()=>show(current+1);
mobile.onchange=()=>show(Number(mobile.value));
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data||e.data.kind!=='stitch-nav')return;const i=mapped[e.data.path];if(Number.isInteger(i))show(i)});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
const initial=pages.findIndex(p=>'#'+p.id===location.hash);show(initial>=0?initial:0);
</script></body></html>
